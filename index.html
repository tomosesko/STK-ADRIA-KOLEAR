<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STK Adria — Koledar žerjavov</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#12161b; --panel:#1b2026; --panel-2:#242b33; --border:#333c47;
  --text:#e9edf1; --text-dim:#97a3b0; --accent:#f0a83c; --accent-ink:#1a1206;
  --naklad:#3fae9c; --razklad:#e08a3c; --drugo:#6b7684; --opravilo:#5b8def; --servis:#c2548a; --danger:#e2574a; --ok:#49b780;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{min-height:100vh;}
code,.mono{font-family:"SF Mono",Menlo,Consolas,monospace;}
a{color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

/* ---------- login ---------- */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    linear-gradient(180deg, rgba(10,13,16,.55) 0%, rgba(10,13,16,.72) 55%, rgba(10,13,16,.88) 100%),
    url('login-bg.jpg') center 30%/cover no-repeat;
}
.login-box{width:100%;max-width:360px;background:rgba(27,32,38,.88);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.45);}
.login-box h1{font-size:20px;margin:0 0 4px;}
.login-box p.sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
.field textarea{resize:vertical;min-height:60px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;font-weight:600;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-full{width:100%;justify-content:center;}
.btn-sm{padding:5px 10px;font-size:12px;}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1px;}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh;flex-direction:column;}
#app.show{display:flex;}
header.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;}
.brand .tag{background:var(--accent);color:var(--accent-ink);font-size:11px;padding:2px 6px;border-radius:5px;}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
.who .role-badge{background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:11px;color:var(--text);}

nav.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;}
nav.tabs button{background:none;border:none;color:var(--text-dim);padding:10px 14px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
nav.tabs button .count{background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:5px;}

main{flex:1;padding:18px;max-width:1100px;width:100%;margin:0 auto;}
.demo-banner{background:#3a2d12;border:1px solid var(--accent);color:#f5d8a0;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.panel h2{margin:0 0 12px;font-size:16px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

/* ---------- calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:11px;color:var(--text-dim);text-align:center;padding:4px 0;}
.cal-day{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;min-height:88px;padding:6px;font-size:12px;position:relative;cursor:pointer;}
.cal-day:hover{border-color:var(--accent);}
.cal-day.other-month{opacity:.35;}
.cal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.cal-day .num{font-weight:700;margin-bottom:4px;}
.chip{display:block;border-radius:5px;padding:2px 5px;margin-bottom:3px;font-size:11px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip.naklad{background:var(--naklad);} .chip.razklad{background:var(--razklad);} .chip.drugo{background:var(--drugo);}
.chip.opravilo{background:var(--opravilo);} .chip.servis{background:var(--servis);}
.chip-more{font-size:10px;color:var(--text-dim);}
.urgent-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(226,87,74,.25);}

.cal-view-toggle{display:flex;gap:4px;}
.cal-view-toggle button{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;}
.cal-view-toggle button.active{color:var(--text);border-color:var(--accent);}

/* ---------- teden/dan: urni prikaz ---------- */
.time-grid-scroll{overflow-x:auto;}
.time-grid{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:600px;}
.time-col{width:52px;flex-shrink:0;border-right:1px solid var(--border);background:var(--panel-2);padding-top:37px;}
.time-col .time-label{font-size:11px;color:var(--text-dim);text-align:right;padding:0 6px;box-sizing:border-box;transform:translateY(-7px);}
.time-day-col{flex:1;border-right:1px solid var(--border);min-width:90px;}
.time-day-col:last-child{border-right:none;}
.time-day-header{padding:8px 4px;text-align:center;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);}
.time-day-header.today{color:var(--accent);}
.time-day-body{position:relative;background:var(--panel);cursor:pointer;}
.time-gridline{position:absolute;left:0;right:0;border-top:1px solid var(--border);opacity:.5;}
.time-event{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:11px;line-height:1.3;color:#fff;overflow:hidden;z-index:2;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.time-event .tt{font-weight:700;display:block;}
.time-event.naklad{background:var(--naklad);} .time-event.razklad{background:var(--razklad);}
.time-event.opravilo{background:var(--opravilo);} .time-event.servis{background:var(--servis);} .time-event.drugo{background:var(--drugo);}

/* ---------- operation cards ---------- */
.op-card{border:1px solid var(--border);border-radius:9px;margin-bottom:10px;background:var(--panel-2);}
.op-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.op-head .type-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;color:#fff;}
.type-badge.naklad{background:var(--naklad);} .type-badge.razklad{background:var(--razklad);}
.type-badge.opravilo{background:var(--opravilo);} .type-badge.servis{background:var(--servis);}
.op-head .crane-name{font-weight:700;}
.op-head .crane-code{color:var(--text-dim);font-size:12px;}
.op-head .meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim);}
.progress-wrap{width:90px;height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;background:var(--ok);}
.status-tag{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--border);}
.status-tag.zaključeno{color:var(--ok);border-color:var(--ok);}
.op-items{border-top:1px solid var(--border);padding:8px 14px;}
.item-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);}
.item-row:last-child{border-bottom:none;}
.item-row input[type=checkbox]{width:18px;height:18px;}
.item-row .pname{flex:1;}
.item-row .pname .qty{color:var(--text-dim);font-size:12px;}
.item-row .note-badge{display:block;font-size:11px;color:var(--razklad);margin-top:2px;}
.item-row.diverted .pname{text-decoration:line-through;color:var(--text-dim);}
.op-footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border);}

/* ---------- alerts ---------- */
.alert-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--panel-2);}
.alert-row.pn{border-left:3px solid var(--razklad);}
.alert-row.al{border-left:3px solid var(--danger);}
.alert-row .msg{flex:1;font-size:13px;}
.alert-row .when{font-size:11px;color:var(--text-dim);}

/* ---------- admin tables ---------- */
table.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
table.admin-table th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border);}
table.admin-table td{padding:7px 8px;border-bottom:1px solid var(--border);}
table.admin-table input,table.admin-table select{width:100%;padding:5px 7px;background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;}
.subtabs{display:flex;gap:6px;margin-bottom:14px;}
.subtabs button{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);padding:7px 12px;border-radius:7px;font-size:13px;}
.subtabs button.active{color:var(--text);border-color:var(--accent);}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:460px;width:100%;max-height:88vh;overflow:auto;}
.modal h3{margin:0 0 14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.detail-line{font-size:13px;margin-bottom:8px;}
.detail-line .k{color:var(--text-dim);display:inline-block;width:90px;}

@media (max-width:640px){
  .cal-day{min-height:64px;font-size:11px;}
  main{padding:12px;}
  .op-head .meta{display:none;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>STK Adria</h1>
    <p class="sub">Koledar žerjavov &amp; naklad/razklad</p>
    <div class="field">
      <label>E-poštni naslov</label>
      <input type="email" id="login-email" autocomplete="username">
    </div>
    <div class="field">
      <label>Geslo</label>
      <input type="password" id="login-password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="login-btn">Prijava</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">STK Adria <span class="tag">KOLEDAR</span></div>
    <div class="who">
      <span id="who-name"></span>
      <span class="role-badge" id="who-role"></span>
      <button class="btn btn-sm" id="logout-btn">Odjava</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="calendar" class="active">Koledar</button>
    <button data-tab="ops">Naklad / Razklad</button>
    <button data-tab="opravila">Opravila</button>
    <button data-tab="servisi">Servisi</button>
    <button data-tab="alerts">Opozorila <span class="count hidden" id="alerts-count">0</span></button>
    <button data-tab="admin" id="tab-admin-btn" class="hidden">Uprava</button>
  </nav>

  <main>
    <div class="demo-banner hidden" id="demo-banner">
      Prikazani so vzorčni podatki (demo način) — Supabase še ni povezan. Glej README.md za nastavitev.
    </div>

    <section id="view-calendar"></section>
    <section id="view-ops" class="hidden"></section>
    <section id="view-opravila" class="hidden"></section>
    <section id="view-servisi" class="hidden"></section>
    <section id="view-alerts" class="hidden"></section>
    <section id="view-admin" class="hidden"></section>
  </main>
</div>

<div id="modal-root"></div>

<script>
/* ============================================================
   KONFIGURACIJA — vstavi svoje Supabase podatke (Settings -> API)
   Dokler je spodaj privzeta vrednost, aplikacija teče v DEMO načinu
   z vzorčnimi podatki (nič se ne shrani).
============================================================ */
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const DEMO_MODE = SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_URL;

const DOW = ['Pon','Tor','Sre','Čet','Pet','Sob','Ned'];
const TYPE_LABEL = {naklad:'NAKLAD', razklad:'RAZKLAD', opravilo:'OPRAVILO', servis:'SERVIS', drugo:'DRUGO'};
const KIND_FILTERKEY = {ops:'opsFilter', opravila:'opravilaFilter', servisi:'servisiFilter'};

function uid(){ return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function fmtDate(d){ d = new Date(d); return d.toLocaleDateString('sl-SI',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d){ d = new Date(d); return d.toLocaleDateString('sl-SI',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'}); }
function toInputDateTime(d){ const dt=new Date(d); const pad=n=>String(n).padStart(2,'0'); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   DEMO PODATKOVNI SLOJ (v spominu) — uporablja se, kadar Supabase
   ni konfiguriran, tako da lahko ekipa/razvoj preizkusi vmesnik.
============================================================ */
function makeDemoStore(){
  const now = new Date();
  const cranes = [
    {id:'c1', code:'CTT91-GASPER', name:'Gašper', model:'CTT 91', serial_number:'G8407124', jib_m:50, height_m:29.05, base_type:'CROSS BASE C38', yard_only:false, notes:'', active:true},
    {id:'c2', code:'CTT91-LUBO', name:'Lubo', model:'CTT 91', serial_number:'G8405103', jib_m:25, height_m:25, base_type:'ANCHORS', yard_only:false, notes:'', active:true},
    {id:'c3', code:'CTT161-MARCOPOLO', name:'Marco Polo', model:'CTT 161', serial_number:'G7610012', jib_m:60, height_m:44.70, base_type:'C45', yard_only:false, notes:'', active:true},
    {id:'c4', code:'CTT231-10-YARDI', name:'Yardi', model:'CTT 231-10', serial_number:'G9808015', jib_m:50, height_m:20, base_type:'C60', yard_only:true, notes:'Žerjav za nakladanje/razkladanje drugih žerjavov — ne gre v najem.', active:true},
  ];
  const part_templates = [
    {id:'pt1', crane_id:'c1', part_name:'Podnožje C38', qty:1, sort_order:1, notes:''},
    {id:'pt2', crane_id:'c1', part_name:'Stolpna sekcija S1', qty:4, sort_order:2, notes:''},
    {id:'pt3', crane_id:'c1', part_name:'Vrtljivi del + kabina', qty:1, sort_order:3, notes:''},
    {id:'pt4', crane_id:'c1', part_name:'Protiroka + balast B', qty:6, sort_order:4, notes:''},
    {id:'pt5', crane_id:'c1', part_name:'Roka — sekcija 1', qty:1, sort_order:5, notes:''},
    {id:'pt6', crane_id:'c1', part_name:'Roka — sekcija vrh', qty:1, sort_order:6, notes:''},
  ];
  const profiles = [
    {id:'u-admin', email:'marjetka@stkadria.si', full_name:'Marjetka Podbregar', role:'admin'},
    {id:'u-viewer', email:'ekipa@stkadria.si', full_name:'Ekipa — skladišče', role:'viewer'},
  ];
  const d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate()+2, 7, 0);
  const d1e = new Date(d1.getTime() + 3*3600*1000);
  const d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 13, 0);
  const d2e = new Date(d2.getTime() + 2*3600*1000);
  const d3 = new Date(now.getFullYear(), now.getMonth(), now.getDate()+5, 8, 0);
  const dLunch = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 12, 0);
  const dLunchE = new Date(dLunch.getTime() + 30*60*1000);
  const stale = new Date(now.getTime() - 2*24*3600*1000); // pred 2 dnevoma, za prikaz "čaka > 1 dan"
  const calendar_events = [
    {id:'e1', crane_id:'c1', type:'naklad', title:'Naklad Gašper', site_name:'Gradbišče Koper — Istrska', start_at:d1.toISOString(), end_at:d1e.toISOString(), notes:'', urgent:false, created_by:'u-admin'},
    {id:'e2', crane_id:'c3', type:'servis', title:'Servis hidravlike', site_name:'Gradbišče Celje', start_at:d2.toISOString(), end_at:d2e.toISOString(), notes:'Puščanje na vrtljivem delu', urgent:true, created_by:'u-admin'},
    {id:'e3', crane_id:null, type:'opravilo', title:'Pospraviti skladišče — cona B', site_name:'', start_at:d3.toISOString(), end_at:null, notes:'', urgent:false, created_by:'u-admin'},
    {id:'e4', crane_id:null, type:'drugo', title:'Malica — Marjetka', site_name:'', start_at:dLunch.toISOString(), end_at:dLunchE.toISOString(), notes:'', urgent:false, created_by:'u-admin'},
  ];
  const operations = [
    {id:'o1', calendar_event_id:'e1', crane_id:'c1', type:'naklad', status:'odprto', stale_alerted:false, closed_at:null, created_at:now.toISOString()},
    {id:'o2', calendar_event_id:'e2', crane_id:'c3', type:'servis', status:'odprto', stale_alerted:false, closed_at:null, created_at:stale.toISOString()},
    {id:'o3', calendar_event_id:'e3', crane_id:null, type:'opravilo', status:'odprto', stale_alerted:false, closed_at:null, created_at:stale.toISOString()},
  ];
  const operation_items = [
    ...part_templates.map((pt,i)=>({
      id:'oi'+i, operation_id:'o1', part_name:pt.part_name, qty:pt.qty, sort_order:pt.sort_order,
      checked:false, checked_by:null, checked_at:null, diverted:false, diverted_note:null, source_note:null
    })),
    {id:'ti1', operation_id:'o2', part_name:'Preveriti hidravlično črpalko', qty:1, sort_order:1, checked:true, checked_by:'u-admin', checked_at:now.toISOString(), diverted:false, diverted_note:null, source_note:null},
    {id:'ti2', operation_id:'o2', part_name:'Zamenjati tesnilo', qty:1, sort_order:2, checked:false, checked_by:null, checked_at:null, diverted:false, diverted_note:null, source_note:null},
    {id:'ti3', operation_id:'o3', part_name:'Zložiti palete', qty:1, sort_order:1, checked:false, checked_by:null, checked_at:null, diverted:false, diverted_note:null, source_note:null},
  ];
  const pending_notes = [];
  const alerts = [];
  const crane_models = [
    {id:'m1', name:'Terex CTT 91-5', pdf_url:'https://stk-adria.com/wp-content/uploads/2024/12/Terex-ctt-91-5.pdf', notes:''},
    {id:'m2', name:'Terex CTT 152-6', pdf_url:'https://stk-adria.com/wp-content/uploads/2024/12/Terex-ctt-152-6.pdf', notes:''},
  ];
  return {cranes, part_templates, profiles, calendar_events, operations, operation_items, pending_notes, alerts, crane_models};
}

function buildDemoDb(){
  const store = makeDemoStore();
  let currentUser = null;
  const listeners = [];
  function notify(){ listeners.forEach(fn=>fn()); }

  function withJoins(op){
    const crane = store.cranes.find(c=>c.id===op.crane_id);
    const event = store.calendar_events.find(e=>e.id===op.calendar_event_id);
    const items = store.operation_items.filter(i=>i.operation_id===op.id).sort((a,b)=>a.sort_order-b.sort_order);
    return {...op, crane, event, items};
  }

  return {
    DEMO_MODE:true,
    auth:{
      async getSession(){ return currentUser ? {user:currentUser} : null; },
      async signIn(email,password){
        const p = store.profiles.find(p=>p.email.toLowerCase()===email.toLowerCase());
        if(!p) throw new Error('V demo načinu uporabi: marjetka@stkadria.si (admin) ali ekipa@stkadria.si (ekipa) — geslo je poljubno.');
        currentUser = {id:p.id, email:p.email};
        return currentUser;
      },
      async signOut(){ currentUser = null; },
      onChange(){ /* no-op v demo načinu */ }
    },
    onRealtime(fn){ listeners.push(fn); },
    async getProfile(userId){ return store.profiles.find(p=>p.id===userId); },
    async listProfiles(){ return store.profiles; },
    async updateProfileRole(id, role){ const p=store.profiles.find(p=>p.id===id); if(p) p.role=role; notify(); },
    async listCranes(){ return [...store.cranes].sort((a,b)=>a.name.localeCompare(b.name)); },
    async upsertCrane(c){
      if(c.id){ Object.assign(store.cranes.find(x=>x.id===c.id), c); }
      else { c.id = uid(); c.active = true; store.cranes.push(c); }
      notify();
    },
    async deleteCrane(id){ store.cranes = store.cranes.filter(c=>c.id!==id); notify(); },
    async listPartTemplates(craneId){ return store.part_templates.filter(p=>p.crane_id===craneId).sort((a,b)=>a.sort_order-b.sort_order); },
    async upsertPartTemplate(pt){
      if(pt.id){ Object.assign(store.part_templates.find(x=>x.id===pt.id), pt); }
      else { pt.id = uid(); store.part_templates.push(pt); }
      notify();
    },
    async deletePartTemplate(id){ store.part_templates = store.part_templates.filter(p=>p.id!==id); notify(); },
    async listEvents(fromISO, toISO){
      return store.calendar_events
        .filter(e=> e.start_at >= fromISO && e.start_at <= toISO)
        .map(e=>({...e, crane: store.cranes.find(c=>c.id===e.crane_id)}));
    },
    async createEvent(evt){
      evt.id = uid(); evt.created_by = currentUser.id; evt.created_at = new Date().toISOString();
      evt.urgent = !!evt.urgent;
      store.calendar_events.push(evt);
      let op = null;
      if(['naklad','razklad','opravilo','servis'].includes(evt.type)){
        op = {id:uid(), calendar_event_id:evt.id, crane_id:evt.crane_id, type:evt.type, status:'odprto', stale_alerted:false, closed_at:null, created_at:new Date().toISOString()};
        store.operations.push(op);
        if(evt.type==='naklad'){
          store.part_templates.filter(pt=>pt.crane_id===evt.crane_id).forEach(pt=>{
            const pn = store.pending_notes.find(n=>n.crane_id===evt.crane_id && n.part_name===pt.part_name && !n.resolved);
            store.operation_items.push({id:uid(), operation_id:op.id, part_name:pt.part_name, qty:pt.qty, sort_order:pt.sort_order, checked:false, checked_by:null, checked_at:null, diverted:false, diverted_note:null, source_note: pn ? pn.note : null});
          });
        } else if(evt.type==='razklad'){
          const srcOps = store.operations.filter(o=>o.crane_id===evt.crane_id && o.type==='naklad')
            .map(o=>({o, ev: store.calendar_events.find(e=>e.id===o.calendar_event_id)}))
            .filter(x=>x.ev && x.ev.start_at <= evt.start_at)
            .sort((a,b)=> b.ev.start_at.localeCompare(a.ev.start_at));
          if(srcOps[0]){
            const srcItems = store.operation_items.filter(i=>i.operation_id===srcOps[0].o.id);
            srcItems.forEach(it=>{
              store.operation_items.push({id:uid(), operation_id:op.id, part_name:it.part_name, qty:it.qty, sort_order:it.sort_order, checked:false, checked_by:null, checked_at:null, diverted:false, diverted_note:null,
                source_note: it.diverted ? ('Prejšnjič ni bil vrnjen: ' + (it.diverted_note||'')) : null});
            });
          }
        }
        // opravilo/servis: brez samodejnih postavk — admin jih doda sam (addTaskItem)
      }
      if(evt.urgent && op){
        store.alerts.push({id:uid(), operation_id:op.id, operation_item_id:null, message:`🔴 Nujno — ${evt.type.toUpperCase()}: ${evt.title||'(brez naslova)'}`, created_at:new Date().toISOString(), resolved:false});
      }
      notify();
      return evt;
    },
    async addTaskItem(operationId, taskName){
      const items = store.operation_items.filter(i=>i.operation_id===operationId);
      const nextOrder = items.length ? Math.max(...items.map(i=>i.sort_order))+1 : 1;
      const item = {id:uid(), operation_id:operationId, part_name:taskName, qty:1, sort_order:nextOrder, checked:false, checked_by:null, checked_at:null, diverted:false, diverted_note:null, source_note:null};
      store.operation_items.push(item);
      notify();
      return item;
    },
    async deleteTaskItem(itemId){ store.operation_items = store.operation_items.filter(i=>i.id!==itemId); notify(); },
    async getOperationByEventId(eventId){ return store.operations.find(o=>o.calendar_event_id===eventId) || null; },
    async checkStaleOperations(){
      const cutoff = Date.now() - 1*24*3600*1000;
      store.operations.forEach(o=>{
        if(['opravilo','servis'].includes(o.type) && o.status==='odprto' && !o.stale_alerted && new Date(o.created_at).getTime() < cutoff){
          const hasUnchecked = store.operation_items.some(i=>i.operation_id===o.id && !i.checked);
          if(hasUnchecked){
            const ev = store.calendar_events.find(e=>e.id===o.calendar_event_id);
            store.alerts.push({id:uid(), operation_id:o.id, operation_item_id:null, message:`⏰ Čaka že več kot 1 dan — ${o.type.toUpperCase()}: ${ev?.title||ev?.site_name||'(brez naslova)'}`, created_at:new Date().toISOString(), resolved:false});
            o.stale_alerted = true;
          }
        }
      });
      notify();
    },
    async listCraneModels(){ return store.crane_models; },
    async deleteEvent(id){
      const op = store.operations.find(o=>o.calendar_event_id===id);
      if(op){ store.operation_items = store.operation_items.filter(i=>i.operation_id!==op.id); store.operations = store.operations.filter(o=>o.id!==op.id); }
      store.calendar_events = store.calendar_events.filter(e=>e.id!==id);
      notify();
    },
    async listOperations(){ return store.operations.map(withJoins).sort((a,b)=> (b.event?.start_at||'').localeCompare(a.event?.start_at||'')); },
    async toggleItem(itemId, checked){
      const it = store.operation_items.find(i=>i.id===itemId);
      it.checked = checked; it.checked_by = checked ? currentUser.id : null; it.checked_at = checked ? new Date().toISOString() : null;
      notify();
    },
    async divertItem(itemId, note){
      const it = store.operation_items.find(i=>i.id===itemId);
      it.diverted = true; it.diverted_note = note; it.checked=false; it.checked_by=null; it.checked_at=null;
      const op = store.operations.find(o=>o.id===it.operation_id);
      store.pending_notes.push({id:uid(), crane_id:op.crane_id, part_name:it.part_name, note, created_by:currentUser.id, created_at:new Date().toISOString(), resolved:false});
      notify();
    },
    async undoDivertItem(itemId){
      const it = store.operation_items.find(i=>i.id===itemId);
      it.diverted=false; it.diverted_note=null;
      notify();
    },
    async closeOperation(opId){
      const op = store.operations.find(o=>o.id===opId);
      op.status='zaključeno'; op.closed_at=new Date().toISOString();
      if(op.type==='razklad'){
        store.operation_items.filter(i=>i.operation_id===opId && !i.checked && !i.diverted).forEach(it=>{
          store.alerts.push({id:uid(), operation_id:opId, operation_item_id:it.id, message:`Manjka pri razkladu: ${it.part_name} (${it.qty} kos)`, created_at:new Date().toISOString(), resolved:false});
        });
      }
      notify();
    },
    async reopenOperation(opId){ const op=store.operations.find(o=>o.id===opId); op.status='odprto'; op.closed_at=null; notify(); },
    async listAlerts(){ return [...store.alerts].sort((a,b)=>b.created_at.localeCompare(a.created_at)); },
    async resolveAlert(id){ const a=store.alerts.find(a=>a.id===id); a.resolved=true; a.resolved_at=new Date().toISOString(); notify(); },
    async listPendingNotes(){ return [...store.pending_notes].map(n=>({...n, crane: store.cranes.find(c=>c.id===n.crane_id)})).sort((a,b)=>b.created_at.localeCompare(a.created_at)); },
    async resolvePendingNote(id){ const n=store.pending_notes.find(n=>n.id===id); n.resolved=true; n.resolved_at=new Date().toISOString(); notify(); },
  };
}

/* ============================================================
   SUPABASE PODATKOVNI SLOJ (pravi backend)
============================================================ */
function buildSupabaseDb(){
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  function check(r){ if(r.error) throw r.error; return r.data; }
  return {
    DEMO_MODE:false,
    auth:{
      async getSession(){ const {data} = await sb.auth.getSession(); return data.session; },
      async signIn(email,password){ const r = await sb.auth.signInWithPassword({email,password}); if(r.error) throw r.error; return r.data.user; },
      async signOut(){ await sb.auth.signOut(); },
      onChange(fn){ sb.auth.onAuthStateChange((_e,session)=>fn(session)); }
    },
    onRealtime(fn){
      sb.channel('db-changes')
        .on('postgres_changes', {event:'*', schema:'public', table:'calendar_events'}, fn)
        .on('postgres_changes', {event:'*', schema:'public', table:'operations'}, fn)
        .on('postgres_changes', {event:'*', schema:'public', table:'operation_items'}, fn)
        .on('postgres_changes', {event:'*', schema:'public', table:'alerts'}, fn)
        .on('postgres_changes', {event:'*', schema:'public', table:'pending_notes'}, fn)
        .subscribe();
    },
    async getProfile(userId){ return check(await sb.from('profiles').select('*').eq('id',userId).single()); },
    async listProfiles(){ return check(await sb.from('profiles').select('*').order('full_name')); },
    async updateProfileRole(id, role){ check(await sb.from('profiles').update({role}).eq('id',id)); },
    async listCranes(){ return check(await sb.from('cranes').select('*').order('name')); },
    async upsertCrane(c){ check(await sb.from('cranes').upsert(c)); },
    async deleteCrane(id){ check(await sb.from('cranes').delete().eq('id',id)); },
    async listPartTemplates(craneId){ return check(await sb.from('part_templates').select('*').eq('crane_id',craneId).order('sort_order')); },
    async upsertPartTemplate(pt){ check(await sb.from('part_templates').upsert(pt)); },
    async deletePartTemplate(id){ check(await sb.from('part_templates').delete().eq('id',id)); },
    async listEvents(fromISO,toISO){
      const rows = check(await sb.from('calendar_events').select('*, cranes(*)').gte('start_at',fromISO).lte('start_at',toISO));
      return rows.map(r=>({...r, crane:r.cranes}));
    },
    async createEvent(evt){ return check(await sb.from('calendar_events').insert(evt).select().single()); },
    async deleteEvent(id){ check(await sb.from('calendar_events').delete().eq('id',id)); },
    async addTaskItem(operationId, taskName){ return check(await sb.rpc('add_task_item', {op_id:operationId, task_name:taskName})); },
    async deleteTaskItem(itemId){ check(await sb.rpc('delete_task_item', {item_id:itemId})); },
    async getOperationByEventId(eventId){
      const rows = check(await sb.from('operations').select('*').eq('calendar_event_id', eventId));
      return rows[0] || null;
    },
    async checkStaleOperations(){ check(await sb.rpc('check_stale_operations')); },
    async listCraneModels(){ return check(await sb.from('crane_models').select('*').order('name')); },
    async listOperations(){
      const rows = check(await sb.from('operations').select('*, cranes(*), calendar_events(*), operation_items(*)'));
      return rows.map(r=>({...r, crane:r.cranes, event:r.calendar_events, items:(r.operation_items||[]).sort((a,b)=>a.sort_order-b.sort_order)}));
    },
    async toggleItem(itemId, checked){ check(await sb.rpc('toggle_item_checked', {item_id:itemId, is_checked:checked})); },
    async divertItem(itemId, note){ check(await sb.rpc('divert_item', {item_id:itemId, note})); },
    async undoDivertItem(itemId){ check(await sb.rpc('undo_divert_item', {item_id:itemId})); },
    async closeOperation(opId){ check(await sb.rpc('close_operation', {op_id:opId})); },
    async reopenOperation(opId){ check(await sb.rpc('reopen_operation', {op_id:opId})); },
    async listAlerts(){ return check(await sb.from('alerts').select('*').order('created_at',{ascending:false})); },
    async resolveAlert(id){ check(await sb.rpc('resolve_alert', {alert_id:id})); },
    async listPendingNotes(){
      const rows = check(await sb.from('pending_notes').select('*, cranes(*)').order('created_at',{ascending:false}));
      return rows.map(r=>({...r, crane:r.cranes}));
    },
    async resolvePendingNote(id){ check(await sb.rpc('resolve_pending_note', {note_id:id})); },
  };
}

/* ============================================================
   KOLEDAR — Mesec / Teden / Dan (kot Google Calendar)
============================================================ */
let calendarEventsCache = [];
const HOUR_START = 6, HOUR_END = 20, HOUR_PX = 48;

function sameDay(iso, d){ const ed = new Date(iso); return ed.getFullYear()===d.getFullYear() && ed.getMonth()===d.getMonth() && ed.getDate()===d.getDate(); }
function fmtHM(iso){ return new Date(iso).toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'}); }
function startOfWeek(d){ const x=new Date(d); const offset=(x.getDay()+6)%7; x.setDate(x.getDate()-offset); x.setHours(0,0,0,0); return x; }
function hourPosition(date){ const h = date.getHours() + date.getMinutes()/60; return Math.max(0, Math.min(HOUR_END-HOUR_START, h-HOUR_START)) * HOUR_PX; }
function eventDurationHours(e){ if(e.end_at){ const h = (new Date(e.end_at) - new Date(e.start_at)) / 3600000; return h>0?h:1; } return 1; }

function calHeader(label){
  return `
    <div class="row-between">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-sm" data-action="cal-prev">←</button>
        <strong style="min-width:170px;display:inline-block;text-align:center;">${label}</strong>
        <button class="btn btn-sm" data-action="cal-next">→</button>
        <button class="btn btn-sm" data-action="cal-today">Danes</button>
        <div class="cal-view-toggle">
          <button class="${State.calView==='month'?'active':''}" data-action="cal-view" data-v="month">Mesec</button>
          <button class="${State.calView==='week'?'active':''}" data-action="cal-view" data-v="week">Teden</button>
          <button class="${State.calView==='day'?'active':''}" data-action="cal-view" data-v="day">Dan</button>
        </div>
      </div>
      ${isAdmin() ? `<button class="btn btn-primary" data-action="new-event">+ Nov dogodek</button>` : ''}
    </div>`;
}

function renderTimeAxis(){
  let rows = '';
  for(let h=HOUR_START; h<=HOUR_END; h++) rows += `<div class="time-label" style="height:${HOUR_PX}px;">${String(h).padStart(2,'0')}:00</div>`;
  return `<div class="time-col">${rows}</div>`;
}
function renderDayBody(date, dayEvents){
  const totalH = (HOUR_END-HOUR_START)*HOUR_PX;
  let lines = '';
  for(let h=HOUR_START; h<=HOUR_END; h++) lines += `<div class="time-gridline" style="top:${(h-HOUR_START)*HOUR_PX}px;"></div>`;
  const blocks = dayEvents.map(e=>{
    const sd = new Date(e.start_at);
    const top = hourPosition(sd);
    const height = Math.max(22, eventDurationHours(e)*HOUR_PX);
    const label = e.crane ? e.crane.name : (e.title || TYPE_LABEL[e.type]);
    return `<div class="time-event ${e.type}" data-action="event-click" data-id="${e.id}" style="top:${top}px;height:${height}px;" title="${escapeHtml(fmtHM(e.start_at)+' '+label)}">
      <span class="tt">${fmtHM(e.start_at)}${e.urgent?' 🔴':''}</span>${escapeHtml(label)}
    </div>`;
  }).join('');
  const clickDate = new Date(date); clickDate.setHours(7,0,0,0);
  return `<div class="time-day-body" data-action="day-click" data-date="${clickDate.toISOString()}" style="height:${totalH}px;">${lines}${blocks}</div>`;
}

async function renderCalendar(){
  if(State.calView==='week') return renderCalendarWeek();
  if(State.calView==='day') return renderCalendarDay();
  return renderCalendarMonth();
}

async function renderCalendarMonth(){
  const el = document.getElementById('view-calendar');
  const month = State.calDate;
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const startOffset = (first.getDay()+6)%7; // ponedeljek = 0
  const gridStart = new Date(first); gridStart.setDate(first.getDate()-startOffset);
  const gridEnd = new Date(gridStart); gridEnd.setDate(gridStart.getDate()+41);

  calendarEventsCache = await db.listEvents(gridStart.toISOString(), gridEnd.toISOString());
  const today = new Date(); today.setHours(0,0,0,0);

  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const inMonth = d.getMonth()===month.getMonth();
    const isToday = d.getTime()===today.getTime();
    const dayEvents = calendarEventsCache.filter(e=>sameDay(e.start_at,d)).sort((a,b)=>a.start_at.localeCompare(b.start_at));
    const shown = dayEvents.slice(0,3);
    cells += `<div class="cal-day ${inMonth?'':'other-month'} ${isToday?'today':''}" data-action="day-click" data-date="${d.toISOString()}">
      <div class="num">${d.getDate()}</div>
      ${shown.map(e=>`<span class="chip ${e.type}" data-action="event-click" data-id="${e.id}" title="${escapeHtml(e.crane?.name||e.title||'')}">${fmtHM(e.start_at)} ${TYPE_LABEL[e.type]}${e.crane ? ' · '+escapeHtml(e.crane.name) : (e.title ? ' · '+escapeHtml(e.title) : '')}${e.urgent?' 🔴':''}</span>`).join('')}
      ${dayEvents.length>3 ? `<div class="chip-more">+${dayEvents.length-3} več</div>`:''}
    </div>`;
  }

  el.innerHTML = `
    <div class="panel">
      ${calHeader(month.toLocaleDateString('sl-SI',{month:'long',year:'numeric'}))}
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;
}

async function renderCalendarWeek(){
  const el = document.getElementById('view-calendar');
  const start = startOfWeek(State.calDate);
  const end = new Date(start); end.setDate(start.getDate()+7);
  calendarEventsCache = await db.listEvents(start.toISOString(), end.toISOString());
  const today = new Date(); today.setHours(0,0,0,0);

  let dayCols = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const isToday = d.getTime()===today.getTime();
    const dayEvents = calendarEventsCache.filter(e=>sameDay(e.start_at,d)).sort((a,b)=>a.start_at.localeCompare(b.start_at));
    dayCols += `<div class="time-day-col">
      <div class="time-day-header ${isToday?'today':''}">${DOW[i]} ${d.getDate()}.${d.getMonth()+1}.</div>
      ${renderDayBody(d, dayEvents)}
    </div>`;
  }
  const lastDay = new Date(end); lastDay.setDate(lastDay.getDate()-1);
  const label = `${start.getDate()}.${start.getMonth()+1}. – ${lastDay.getDate()}.${lastDay.getMonth()+1}.${lastDay.getFullYear()}`;

  el.innerHTML = `
    <div class="panel">
      ${calHeader(label)}
      <div class="time-grid-scroll"><div class="time-grid">${renderTimeAxis()}${dayCols}</div></div>
    </div>`;
}

async function renderCalendarDay(){
  const el = document.getElementById('view-calendar');
  const d = new Date(State.calDate); d.setHours(0,0,0,0);
  const end = new Date(d); end.setDate(d.getDate()+1);
  calendarEventsCache = await db.listEvents(d.toISOString(), end.toISOString());
  const dayEvents = calendarEventsCache.filter(e=>sameDay(e.start_at,d)).sort((a,b)=>a.start_at.localeCompare(b.start_at));
  const label = d.toLocaleDateString('sl-SI',{weekday:'long', day:'numeric', month:'long', year:'numeric'});

  el.innerHTML = `
    <div class="panel">
      ${calHeader(label)}
      <div class="time-grid-scroll"><div class="time-grid">${renderTimeAxis()}
        <div class="time-day-col" style="flex:3;min-width:220px;">
          <div class="time-day-header today">${label}</div>
          ${renderDayBody(d, dayEvents)}
        </div>
      </div></div>
    </div>`;
}

async function saveEventForm(){
  const crane_id = document.getElementById('f-crane').value || null;
  const type = document.getElementById('f-type').value;
  const title = document.getElementById('f-title').value.trim();
  const site_name = document.getElementById('f-site').value.trim();
  const startLocal = document.getElementById('f-start').value;
  const endLocal = document.getElementById('f-end').value;
  const notes = document.getElementById('f-notes').value.trim();
  const urgent = document.getElementById('f-urgent').checked;
  const taskLines = document.getElementById('f-tasks').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!startLocal){ document.getElementById('f-err').textContent='Izberi čas.'; return; }
  if(!crane_id && !['opravilo','drugo'].includes(type)){ document.getElementById('f-err').textContent='Za to vrsto dogodka izberi žerjav.'; return; }
  if(endLocal && new Date(endLocal) <= new Date(startLocal)){ document.getElementById('f-err').textContent='Konec mora biti za začetkom.'; return; }
  try{
    const evt = await db.createEvent({crane_id, type, title, site_name, start_at: new Date(startLocal).toISOString(), end_at: endLocal ? new Date(endLocal).toISOString() : null, notes, urgent});
    if((type==='opravilo' || type==='servis') && taskLines.length){
      const op = await db.getOperationByEventId(evt.id);
      if(op) for(const task of taskLines){ await db.addTaskItem(op.id, task); }
    }
    closeModal();
    await renderCalendar();
    await renderOps(); await renderOpravila(); await renderServisi();
    await refreshAlertBadge();
  }catch(e){ document.getElementById('f-err').textContent = e.message; }
}

function renderOpCard(op, kind){
  const cfg = KIND_CONFIG[kind];
  const isCraneKind = kind==='ops';
  const total = op.items.length;
  const checked = op.items.filter(i=>i.checked).length;
  const pct = total ? Math.round(checked/total*100) : 0;
  const expanded = State[cfg.expandedKey] === op.id;
  const label = op.crane
    ? `<span class="crane-name">${escapeHtml(op.crane.name)}</span><span class="crane-code mono">${escapeHtml(op.crane.code)}</span>`
    : `<span class="crane-name">${escapeHtml(op.event?.title || 'Splošno')}</span>`;
  return `
    <div class="op-card">
      <div class="op-head" data-action="toggle-op" data-kind="${kind}" data-id="${op.id}">
        <span class="type-badge ${op.type}">${TYPE_LABEL[op.type]}</span>
        ${label}
        ${op.event?.urgent ? `<span class="urgent-dot" title="Nujno"></span>` : ''}
        <span class="meta">
          ${op.event?.site_name ? escapeHtml(op.event.site_name)+' · ' : ''}${op.event ? fmtDate(op.event.start_at) : ''}
          <span class="progress-wrap"><span class="progress-bar" style="width:${pct}%"></span></span>
          ${checked}/${total}
          <span class="status-tag ${op.status}">${op.status}</span>
        </span>
      </div>
      ${expanded ? `
        <div class="op-items">
          ${op.items.length===0 ? `<p style="color:var(--text-dim);font-size:13px;margin:4px 0;">${isCraneKind?'Ni postavk.':'Ni še nalog.'}</p>` : op.items.map(it=>`
            <div class="item-row ${it.diverted?'diverted':''}">
              <input type="checkbox" ${it.checked?'checked':''} ${it.diverted?'disabled':''} data-action="toggle-item" data-kind="${kind}" data-id="${it.id}">
              <div class="pname">
                ${escapeHtml(it.part_name)} ${isCraneKind?`<span class="qty">× ${it.qty}</span>`:''}
                ${it.source_note ? `<span class="note-badge">⚠ ${escapeHtml(it.source_note)}</span>`:''}
                ${it.diverted ? `<span class="note-badge">↪ Šlo drugam: ${escapeHtml(it.diverted_note||'')}</span>`:''}
              </div>
              ${isAdmin() && isCraneKind ? (it.diverted
                  ? `<button class="btn btn-sm" data-action="undo-divert" data-id="${it.id}">Prekliči</button>`
                  : `<button class="btn btn-sm" data-action="divert-item" data-id="${it.id}">Šlo drugam</button>`
                ) : ''}
              ${isAdmin() && !isCraneKind && op.status==='odprto' ? `<button class="btn btn-sm btn-danger" data-action="delete-task" data-kind="${kind}" data-id="${it.id}">×</button>` : ''}
            </div>`).join('')}
        </div>
        ${isAdmin() && !isCraneKind && op.status==='odprto' ? `
          <div class="op-items" style="padding-top:0;display:flex;gap:6px;">
            <input id="task-input-${op.id}" placeholder="Nova naloga ..." style="flex:1;padding:7px;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);">
            <button class="btn btn-sm btn-primary" data-action="add-task" data-kind="${kind}" data-id="${op.id}">+ Dodaj</button>
          </div>
        ` : ''}
        <div class="op-footer">
          ${isAdmin() && op.status==='odprto' ? `<button class="btn btn-primary" data-action="close-op" data-kind="${kind}" data-id="${op.id}">Zaključi</button>`:''}
          ${isAdmin() && op.status==='zaključeno' ? `<button class="btn" data-action="reopen-op" data-kind="${kind}" data-id="${op.id}">Ponovno odpri</button>`:''}
        </div>
      ` : ''}
    </div>`;
}

  document.getElementById('view-alerts').classList.toggle('hidden', State.tab!=='alerts');

document.addEventListener('click', async (ev)=>{
  const t = ev.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='modal-backdrop' && ev.target===t) return closeModal();
  if(action==='modal-close') return closeModal();

  switch(action){
    case 'new-event': return openEventForm();
    case 'day-click': return openEventForm(t.dataset.date);
    case 'event-click': { ev.stopPropagation(); return openEventDetail(t.dataset.id); }
    case 'save-event': return saveEventForm();
    case 'delete-event': await db.deleteEvent(t.dataset.id); closeModal(); return render();
    case 'goto-ops': { closeModal(); State.tab = t.dataset.goto || 'ops'; return render(); }
    case 'cal-view': State.calView = t.dataset.v; return renderCalendar();
    case 'cal-prev': {
      if(State.calView==='month') State.calDate = new Date(State.calDate.getFullYear(), State.calDate.getMonth()-1, 1);
      else if(State.calView==='week'){ const d=new Date(State.calDate); d.setDate(d.getDate()-7); State.calDate=d; }
      else { const d=new Date(State.calDate); d.setDate(d.getDate()-1); State.calDate=d; }
      return renderCalendar();
    }
    case 'cal-next': {
      if(State.calView==='month') State.calDate = new Date(State.calDate.getFullYear(), State.calDate.getMonth()+1, 1);
      else if(State.calView==='week'){ const d=new Date(State.calDate); d.setDate(d.getDate()+7); State.calDate=d; }
      else { const d=new Date(State.calDate); d.setDate(d.getDate()+1); State.calDate=d; }
      return renderCalendar();
    }
    case 'cal-today': State.calDate = new Date(); return renderCalendar();

    case 'ops-filter': { const kind=t.dataset.kind; State[KIND_FILTERKEY[kind]] = t.dataset.f; return KIND_CONFIG[kind].render(); }
    case 'toggle-op': { const kind=t.dataset.kind; const cfg=KIND_CONFIG[kind]; State[cfg.expandedKey] = (State[cfg.expandedKey]===t.dataset.id) ? null : t.dataset.id; return cfg.render(); }
    case 'toggle-item': { ev.stopPropagation(); const kind=t.dataset.kind; await db.toggleItem(t.dataset.id, t.checked); return KIND_CONFIG[kind].render(); }
    case 'divert-item': { ev.stopPropagation(); return openDivertForm(t.dataset.id); }
    case 'save-divert': return saveDivertForm(t.dataset.id);
    case 'undo-divert': { ev.stopPropagation(); await db.undoDivertItem(t.dataset.id); return renderOps(); }
    case 'add-task': {
      ev.stopPropagation();
      const kind=t.dataset.kind, opId=t.dataset.id;
      const input = document.getElementById('task-input-'+opId);
      const name = input.value.trim();
      if(!name) return;
      await db.addTaskItem(opId, name);
      return KIND_CONFIG[kind].render();
    }
    case 'delete-task': { ev.stopPropagation(); const kind=t.dataset.kind; await db.deleteTaskItem(t.dataset.id); return KIND_CONFIG[kind].render(); }
    case 'close-op': {
      ev.stopPropagation();
      const kind=t.dataset.kind;
      if(!confirm('Zaključi? Neobkljukane postavke bodo (pri razkladu takoj, pri opravilih/servisih naslednji dan) sprožile opozorilo.')) return;
      await db.closeOperation(t.dataset.id);
      await KIND_CONFIG[kind].render(); return refreshAlertBadge();
    }
    case 'reopen-op': { ev.stopPropagation(); const kind=t.dataset.kind; await db.reopenOperation(t.dataset.id); return KIND_CONFIG[kind].render(); }

    case 'resolve-alert': await db.resolveAlert(t.dataset.id); return renderAlerts();
    case 'resolve-note': await db.resolvePendingNote(t.dataset.id); return renderAlerts();

    case 'admin-sub': State.adminSub = t.dataset.s; return renderAdmin();
    case 'new-crane': return openCraneForm(null);
    case 'edit-crane': return openCraneForm(t.dataset.id);
    case 'save-crane': return saveCraneForm(t.dataset.id || null);
    case 'delete-crane': if(confirm('Izbriši žerjav?')){ await db.deleteCrane(t.dataset.id); State.cranes=await db.listCranes(); await renderAdmin(); } return;
    case 'crane-list': State.adminCraneOpen = (State.adminCraneOpen===t.dataset.id) ? null : t.dataset.id; return renderAdmin();
    case 'delete-part-template': await db.deletePartTemplate(t.dataset.id); return renderAdmin();
    case 'add-part-template': {
      const craneId = t.dataset.crane;
      const part_name = document.getElementById('pt-name').value.trim();
      const qty = parseInt(document.getElementById('pt-qty').value) || 1;
      const sort_order = parseInt(document.getElementById('pt-order').value) || 0;
      const notes = document.getElementById('pt-notes').value.trim();
      if(!part_name) return;
      await db.upsertPartTemplate({crane_id:craneId, part_name, qty, sort_order, notes});
      return renderAdmin();
    }
  }
});
document.addEventListener('change', async (ev)=>{
  const roleSel = ev.target.closest('[data-action="role-select"]');
  if(roleSel){ await db.updateProfileRole(roleSel.dataset.id, roleSel.value); return renderAdmin(); }

  if(ev.target.id === 'f-type'){
    const isTask = ['opravilo','servis'].includes(ev.target.value);
    document.getElementById('f-tasks-wrap').classList.toggle('hidden', !isTask);
    document.getElementById('f-crane-label').textContent = ['opravilo','drugo'].includes(ev.target.value) ? 'Žerjav (neobvezno)' : 'Žerjav';
  }
});

document.querySelectorAll('nav.tabs button[data-tab]').forEach(btn=>{
  btn.addEventListener('click', ()=>{ State.tab = btn.dataset.tab; render(); });
});
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logout-btn').addEventListener('click', doLogout);

db.auth.onChange(()=>{});
db.onRealtime?.(()=>{ render(); });
bootSession();
</script>
</body>
</html>
